name: Apply fn compatibility patch

on:
  push:
    branches:
      - fn-identifier-compat

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fn-identifier-compat

      - name: Remove fn from reserved keywords
        run: |
          python3 - <<'PY'
          from pathlib import Path

          needle = '    { "fn",         FUNCTION   },\n'
          for filename in ("code/src/main/gram.y", "code/src/main/gram.c"):
              path = Path(filename)
              text = path.read_text()
              count = text.count(needle)
              if count != 1:
                  raise SystemExit(f"expected exactly one reserved fn entry in {filename}, found {count}")
              path.write_text(text.replace(needle, ""))
          PY

      - name: Commit parser patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code/src/main/gram.y code/src/main/gram.c
          git diff --cached --check
          git commit -m "Restore fn as an ordinary identifier"
          git push origin HEAD:fn-identifier-compat
