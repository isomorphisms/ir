name: Unicode lexer

on:
  push:
    branches:
      - equality-glyph-aliases
  pull_request:
    paths:
      - code/src/main/gram.c
      - code/src/main/gram.y
      - code/src/include/Rinlinedfuns.h
      - code/tests/reg-encodings.R
      - code/tests/ir-unicode-lexer.R
      - code/tests/ir-package-compat.R
      - .github/workflows/lexer.yml

jobs:
  lexer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
      IR_BUILD_LOCALE: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran perl pkg-config texinfo \
            libreadline-dev libpcre2-dev libcurl4-openssl-dev \
            libbz2-dev liblzma-dev zlib1g-dev libdeflate-dev \
            libuv1-dev

      - name: Verify libuv development interface
        run: |
          cat > /tmp/ir-libuv-probe.c <<'EOF'
          #include <uv.h>

          int main(void)
          {
              return uv_version() == 0;
          }
          EOF
          cc \
            $(pkg-config --cflags libuv) \
            /tmp/ir-libuv-probe.c \
            $(pkg-config --libs libuv) \
            -o /tmp/ir-libuv-probe
          /tmp/ir-libuv-probe

      - name: Configure
        run: |
          mkdir build
          cd build
          sh ../code/configure \
            --with-x=no \
            --without-tcltk \
            --without-recommended-packages \
            --disable-java

      - name: Build
        run: make -C build -j2

      - name: Test Unicode lexer priority
        run: build/bin/R --vanilla < code/tests/ir-unicode-lexer.R

      - name: Install rlang compatibility oracle
        run: |
          mkdir -p build/compat-lib
          IR_COMPAT_LIB="$PWD/build/compat-lib" \
            build/bin/Rscript -e 'install.packages("rlang", lib = Sys.getenv("IR_COMPAT_LIB"), repos = "https://cloud.r-project.org", type = "source")'

      - name: Test bare fn package compatibility
        env:
          IR_COMPAT_LIB: ${{ github.workspace }}/build/compat-lib
        run: build/bin/R --vanilla < code/tests/ir-package-compat.R
